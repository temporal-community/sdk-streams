[workspace]
members = ["crates/streams-redis"]
resolver = "3"

[workspace.package]
license = "MIT"
license-file = "LICENSE.txt"

[workspace.dependencies]
prost = "0.14"
# A lang bridge patches both to the copies in its `sdk-core` submodule, so that each type exists
# once.
temporalio-common = { version = "1.2", default-features = false }
temporalio-streams = "0.1"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"

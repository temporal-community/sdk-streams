[package]
name = "temporalio-streams-redis"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Temporal Technologies Inc. <sdk@temporal.io>"]
license-file = { workspace = true }
description = "The experimental Redis Store of the Temporal Stream runtime"
homepage = "https://temporal.io/"
repository = "https://github.com/temporal-community/sdk-streams"
keywords = ["temporal", "workflow", "streams", "redis"]
categories = ["development-tools"]

[features]
default = ["tls-ring"]
# The TLS providers of the sdk-rust crates. A FIPS build uses `tls-aws-lc` with no default features,
# so that no crate in the build depends on `ring`.
tls-ring = ["temporalio-common/tls-ring"]
tls-aws-lc = ["temporalio-common/tls-aws-lc"]
# Turns on `tls-aws-lc` and the FIPS mode of `aws-lc-rs`, so that the shared rustls provider links
# `aws-lc-fips-sys`.
fips = ["tls-aws-lc", "dep:aws-lc-rs"]

[dependencies]
# Only with `fips`. The crate doesn't call it. Its `fips` feature puts the one `aws-lc-rs` of the
# build in FIPS mode.
aws-lc-rs = { version = "1", features = ["fips"], optional = true }
crc16 = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# Its locks have no poisoning. Each critical section here is one push, pop or clear.
parking_lot = "0.12"
prost = { workspace = true }
rand = "0.10"
# TLS uses the rustls provider that the process installs, the same one Core uses.
redis = { version = "1.7", default-features = false, features = [
    "cluster-async",
    "connection-manager",
    "script",
    "tokio-rustls-comp",
] }
sha2 = "0.11"
temporalio-common = { workspace = true }
temporalio-streams = { workspace = true }
thiserror = "2"
tokio = { version = "1.47", default-features = false, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true

[package]
name = "temporalio-streams-log"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Temporal Technologies Inc. <sdk@temporal.io>"]
license-file = { workspace = true }
description = "The shared part of the Temporal Stream Stores that keep each Stream as a log"
homepage = "https://temporal.io/"
repository = "https://github.com/temporal-community/sdk-streams"
keywords = ["temporal", "workflow", "streams"]
categories = ["development-tools"]

[features]
# The shared suites, for the crates of the Stores.
test-support = ["dep:futures-util", "dep:tonic", "tokio/rt"]

[dependencies]
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
prost = { workspace = true }
prost-types = { workspace = true }
sha2 = "0.10"
temporalio-common = { workspace = true }
temporalio-streams = { workspace = true }
tokio = { version = "1.47", default-features = false, features = ["sync", "time"] }
tonic = { version = "0.14", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1"
# The tests of `dispatch` need `#[tokio::test]` and `tonic::Code`.
tokio = { version = "1.47", default-features = false, features = ["macros", "rt"] }
tonic = { version = "0.14", default-features = false }

[lints]
workspace = true

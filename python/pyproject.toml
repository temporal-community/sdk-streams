[project]
name = "temporalio-streams-redis"
version = "0.1.0"
description = "The Redis Store of Temporal Streams for the Python SDK"
authors = [{ name = "Temporal Technologies Inc", email = "sdk@temporal.io" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
keywords = ["temporal", "workflow", "streams", "redis"]
dependencies = ["temporalio"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/temporal-community/sdk-streams"

[dependency-groups]
dev = [
  "maturin>=1.8,<2",
  "pyright==1.1.414",
  # pytest-asyncio 0.21 relies on pytest internals that pytest 9.2 removed.
  "pytest>=9.0,<9.2",
  "pytest-asyncio>=0.21,<0.22",
  "ruff>=0.15.12,<0.16",
]

[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "temporalio_streams_redis._native"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.pyright]
include = ["temporalio_streams_redis", "tests"]
exclude = ["**/__pycache__", "target"]
strict = ["temporalio_streams_redis"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]

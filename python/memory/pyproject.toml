[project]
name = "temporalio-streams-memory"
version = "0.1.0"
description = "The memory Store of Temporal Streams for the Python SDK, for tests"
authors = [{ name = "Temporal Technologies Inc", email = "sdk@temporal.io" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
keywords = ["temporal", "workflow", "streams", "memory"]
dependencies = ["temporalio"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/temporal-community/sdk-streams"

[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "temporalio_streams_memory._native"

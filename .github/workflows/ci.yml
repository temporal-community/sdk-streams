name: CI

on:
  pull_request:
  push:
    branches: [main]

# The jobs only read the repo, and `setup-protoc` reads releases.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The branch that has `temporalio-streams`, until a release of sdk-rust has the crate.
  SDK_RUST_GIT: https://github.com/moetemp/sdk-rust
  SDK_RUST_REF: moe/redo/streams

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy, rustfmt
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: scripts/patch-sdk-rust.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --tests -- -D warnings
      - run: >-
          cargo clippy --workspace --no-default-features --features tls-aws-lc --tests
          -- -D warnings

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: scripts/patch-sdk-rust.sh
      - run: cargo test --workspace

  fips:
    name: FIPS build takes no ring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: scripts/patch-sdk-rust.sh
      - run: cargo build --workspace --no-default-features --features fips
      # Normal and build edges only, since the tests' own dependencies may depend on `ring`.
      - run: |
          tree=$(cargo tree -e normal,build --no-default-features --features fips \
            -i ring --target all)
          if [ -n "$tree" ]; then echo "$tree"; exit 1; fi

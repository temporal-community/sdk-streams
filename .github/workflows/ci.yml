name: CI

on:
  pull_request:
  push:
    branches: [main]

# The jobs only read the repo, and `setup-protoc` reads releases.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The sdk-python commit that has the Streams API and lets Core call a Store that is written in
  # Python. It moves to a release of `temporalio` when one has Streams.
  SDK_PYTHON_REV: 340a1a78632dda93e9585944612d6233920d10f1

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy, rustfmt
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: scripts/patch-sdk-rust.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --tests -- -D warnings
      - run: >-
          cargo clippy --workspace --no-default-features --features tls-aws-lc --tests
          -- -D warnings

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: scripts/patch-sdk-rust.sh
      - run: cargo test --workspace

  fips:
    name: FIPS build takes no ring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: scripts/patch-sdk-rust.sh
      - run: cargo build --workspace --no-default-features --features fips
      # Normal and build edges only, since the tests' own dependencies may depend on `ring`.
      - run: |
          tree=$(cargo tree -e normal,build --no-default-features --features fips \
            -i ring --target all)
          if [ -n "$tree" ]; then echo "$tree"; exit 1; fi

  redis:
    name: Redis Store tests (standalone and cluster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: scripts/patch-sdk-rust.sh
      - name: Install Redis from the Redis apt repo
        run: |
          curl -fsSL https://packages.redis.io/gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg]" \
            "https://packages.redis.io/deb $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/redis.list
          sudo apt-get update && sudo apt-get install -y redis
      - run: crates/streams-redis/scripts/redis-test-servers.sh >> "$GITHUB_ENV"
      - run: cargo test -p temporalio-streams-redis -- --include-ignored --test-threads=8

  redis-7-0:
    name: Redis 7.0 Store tests (standalone and cluster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: scripts/patch-sdk-rust.sh
      # The script runs the servers in docker and needs only `redis-cli` on the host.
      - run: sudo apt-get update && sudo apt-get install -y redis-tools
      # The oldest Redis that `connect` accepts.
      - run: crates/streams-redis/scripts/redis-test-servers.sh >> "$GITHUB_ENV"
        env:
          STREAMS_REDIS_IMAGE: redis:7.0
      - run: cargo test -p temporalio-streams-redis -- --include-ignored --test-threads=8

  python-lint:
    name: Python packages lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Only its source, for pyright. The package is not built here.
      - uses: actions/checkout@v4
        with:
          repository: temporalio/sdk-python
          ref: ${{ env.SDK_PYTHON_REV }}
          path: sdk-python
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy, rustfmt
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The sdk-rust commit of python/Cargo.toml is the one of the patch script
        run: |
          script_rev=$(sed -n 's/^rev=.*:-\([0-9a-f]*\)}$/\1/p' scripts/patch-sdk-rust.sh)
          toml_revs=$(sed -n 's/^rev = "\([0-9a-f]*\)"$/\1/p' python/Cargo.toml | sort -u)
          if [ -z "$script_rev" ] || [ "$script_rev" != "$toml_revs" ]; then
            echo "scripts/patch-sdk-rust.sh has '$script_rev', python/Cargo.toml has '$toml_revs'"
            exit 1
          fi
      # `python/LICENSE.txt` is a copy, since `maturin` takes no license file from outside the
      # Cargo workspace of `python`.
      - run: cmp LICENSE.txt python/LICENSE.txt
      - run: cargo fmt --manifest-path python/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path python/Cargo.toml -- -D warnings
      # `pip install --group` needs pip 25.1 or later. The SDK's own dependencies give pyright the
      # types that `temporalio` uses.
      - name: Install ruff, pyright and the dependencies of temporalio
        run: |
          python -m pip install -U pip
          python -m pip install --group python/pyproject.toml:dev
          python - <<'PY' > sdk-requirements.txt
          import tomllib

          with open("sdk-python/pyproject.toml", "rb") as file:
              print(*tomllib.load(file)["project"]["dependencies"], sep="\n")
          PY
          python -m pip install -r sdk-requirements.txt
      - run: ruff check python
      - run: ruff format --check python
      # No release of `temporalio` has Streams yet, so pyright reads the SDK source.
      - run: pyright
        working-directory: python
        env:
          PYTHONPATH: ${{ github.workspace }}/sdk-python

  python-test:
    name: Python packages tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: temporalio/sdk-python
          ref: ${{ env.SDK_PYTHON_REV }}
          submodules: recursive
          path: sdk-python
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The wheel is the slow part, so it is cached by the sdk-python commit.
      - name: Restore the temporalio wheel
        id: sdk-wheel
        uses: actions/cache@v4
        with:
          path: sdk-wheel
          key: temporalio-wheel-${{ runner.os }}-${{ env.SDK_PYTHON_REV }}
      - name: Build the temporalio wheel
        if: steps.sdk-wheel.outputs.cache-hit != 'true'
        # Inside this checkout, cargo takes the SDK's bridge for a member of this repo's workspace.
        run: |
          mv sdk-python "$RUNNER_TEMP/sdk-python"
          python -m pip wheel --no-deps --wheel-dir sdk-wheel "$RUNNER_TEMP/sdk-python"
      - name: Install Redis from the Redis apt repo
        run: |
          curl -fsSL https://packages.redis.io/gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg]" \
            "https://packages.redis.io/deb $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/redis.list
          sudo apt-get update && sudo apt-get install -y redis
      - run: crates/streams-redis/scripts/redis-test-servers.sh >> "$GITHUB_ENV"
      - name: Install the wheel, the two packages and the test tools
        run: |
          python -m pip install -U pip
          python -m pip install --group python/pyproject.toml:dev
          python -m pip install sdk-wheel/temporalio-*.whl ./python/redis ./python/memory
      - run: python -m pytest python/redis/tests python/memory/tests
        timeout-minutes: 30

  python-wheels:
    name: Python package wheel (${{ matrix.package }}, ${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: [redis, memory]
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
          - name: linux-aarch64
            runner: ubuntu-latest
            target: aarch64
            # The compiler of the cross image doesn't define it, and `ring` needs it.
            docker-options: -e CFLAGS_aarch64_unknown_linux_gnu=-D__ARM_ARCH=8
          - name: macos-arm64
            runner: macos-latest
            target: aarch64
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64
          - name: windows-x86_64
            runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path python/${{ matrix.package }}/Cargo.toml
          manylinux: auto
          docker-options: ${{ matrix.platform.docker-options }}
          # The Linux build runs in a container, which has no protoc.
          before-script-linux: |
            release=https://github.com/protocolbuffers/protobuf/releases/download/v29.3
            curl -fsSL -o /tmp/protoc.zip "$release/protoc-29.3-linux-x86_64.zip"
            # The aarch64 container runs on x86_64, and its `/opt/python` is for the target.
            python=$(command -v python3 || echo /opt/python/cp311-cp311/bin/python)
            "$python" -m zipfile -e /tmp/protoc.zip /usr/local
            chmod +x /usr/local/bin/protoc
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.package }}-${{ matrix.platform.name }}
          path: dist
